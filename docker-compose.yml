networks:
  proxy-network:
    external: true
  internal-network:
    driver: bridge
    internal: true

volumes:
  deployx-data: {}
  deployx-builds: {}

services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@localhost}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - docker-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/lib/deployx/certs:/certs
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - proxy-network
      - internal-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/ping || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  docker-proxy:
    # v0.4.2 (Caddy-based) is required: older haproxy-based versions do not
    # forward the Docker API version header, which Engine 25+ rejects.
    # See: https://github.com/Tecnativa/docker-socket-proxy/releases/tag/v0.4.2
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    cpus: 0.1
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      BUILD: 1
      POST: 1
      EVENTS: 1
      # Required for Nixpacks builds via the Docker CLI:
      INFO: 1
      VERSION: 1
      PING: 1
      AUTH: 1
      EXEC: 0
      SERVICES: 0
      SECRETS: 0
      CONFIGS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal-network

  api:
    image: deployx/api:${DEPLOYX_VERSION:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - deployx-data:/data
      - deployx-builds:/builds
    env_file:
      - .env
    environment:
      # Docker CLI (used by Nixpacks) talks to the socket proxy, not /var/run/docker.sock
      - DOCKER_HOST=tcp://docker-proxy:2375
    depends_on:
      - docker-proxy
    networks:
      - proxy-network
      - internal-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deployx-api.rule=Host(`${PLATFORM_DOMAIN:-localhost}`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.deployx-api.priority=100"
      - "traefik.http.routers.deployx-api.entrypoints=websecure"
      - "traefik.http.routers.deployx-api.tls=true"
      - "traefik.http.routers.deployx-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.deployx-api.loadbalancer.server.port=3001"
      - "traefik.http.routers.deployx-api.middlewares=security-headers@file,rate-limit@file"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    image: deployx/dashboard:${DEPLOYX_VERSION:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      - api
    networks:
      - proxy-network
      - internal-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deployx-dashboard.rule=Host(`${PLATFORM_DOMAIN:-localhost}`)"
      - "traefik.http.routers.deployx-dashboard.priority=50"
      - "traefik.http.routers.deployx-dashboard.entrypoints=websecure"
      - "traefik.http.routers.deployx-dashboard.tls=true"
      - "traefik.http.routers.deployx-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.deployx-dashboard.loadbalancer.server.port=3000"
      - "traefik.http.routers.deployx-dashboard.middlewares=security-headers@file"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
